[package]
name = "ymdb"
version = "0.1.0"
description = "Your MAME DB (YMDB) - a cross-platform desktop frontend for MAME"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
# See https://github.com/rust-lang/cargo/issues/8519
name = "ymdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = "0.42"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
